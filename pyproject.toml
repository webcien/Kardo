[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kardocore"
version = "0.2.2"
description = "Modern Python CMS Framework - Fast, Typed, Secure, Modular"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "WebCien", email = "contact@webcien.com"}
]
keywords = [
    "cms", "framework", "web", "async", "database",
    "authentication", "theme", "template", "modern",
    "typed", "fast", "secure", "modular",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
]
dependencies = [
    "bcrypt>=4.0.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
# Database adapters
postgresql = ["asyncpg>=0.28.0"]
mysql = ["aiomysql>=0.2.0"]

# Installation modes
admin = [
    "bcrypt>=4.0.0",
    "aiosqlite>=0.19.0",
]
full = [
    "bcrypt>=4.0.0",
    "aiosqlite>=0.19.0",
]
theme = [
    "jinja2>=3.1.0",
    "markdown>=3.4.0",
]

# All optional dependencies
all = [
    "asyncpg>=0.28.0",
    "aiomysql>=0.2.0",
    "argon2-cffi>=21.3.0",
    "jinja2>=3.1.0",
    "markdown>=3.4.0",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "mypy>=1.5.0",
    "ruff>=0.0.290",
]

[project.urls]
Homepage = "https://github.com/webcien/Kardo"
Repository = "https://github.com/webcien/Kardo"

[project.scripts]
kardo = "kardocore.cli.main:main"
