<div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Contenido</h1>
    <a href="/admin/content/create" class="btn btn-primary">+ Nuevo Post</a>
</div>

<div class="card shadow-md">
    <div class="overflow-x-auto">
        <table class="table-admin">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Slug</th>
                    <th>Estado</th>
                    <th>Creado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                #for item in items
                <tr>
                    <td>{item.id}</td>
                    <td>{item.title}</td>
                    <td class="text-sm text-gray-600">{item.slug}</td>
                    <td>
                        <span class="badge badge-{item.status}">{item.status}</span>
                    </td>
                    <td>{item.created_at}</td>
                    <td class="flex gap-2">
                        <a href="/admin/content/{item.id}/edit" class="btn-action btn-edit">Editar</a>
                        <button class="btn-action btn-delete touch-target" onclick="deleteContent({item.id})">Eliminar</button>
                    </td>
                </tr>
                #end
            </tbody>
        </table>
    </div>
</div>
